<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJUPTEL Carabobo - Control de Inscripciones</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .table-responsive {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .main-heading {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 8px;
            margin-bottom: 1.5rem;
        }
        .familiar-row {
            background-color: #f1f3f5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- Navbar institucional -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
                AJUPTEL Carabobo - Control de Inscripciones
            </span>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Cabecera de la sección con los botones -->
        <div class="row align-items-center mb-3 main-heading pb-2">
            <div class="col-md-7">
                <h2 class="text-primary m-0" style="font-size: 1.75rem;">Gestión de Jubilados y Afiliados</h2>
            </div>
            <div class="col-md-5 text-md-end mt-2 mt-md-0">
                <!-- Botón de Planilla en Blanco -->
                <a href="/api/planilla-en-blanco/pdf" target="_blank" class="btn btn-secondary me-2">
                    <i class="fas fa-file-pdf"></i> Planilla en Blanco
                </a>
                <!-- Botón de Nuevo Registro -->
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalRegistro" id="btnNuevoRegistro">
                    <i class="fas fa-plus"></i> Nuevo Registro
                </button>
            </div>
        </div>

        <!-- Listado de Registros -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-secondary mb-3">Listado de Inscripciones Nómina CANTV</h5>
                <div class="table-responsive p-0">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Cédula</th>
                                <th>Nombres y Apellidos</th>
                                <th>P00</th>
                                <th>Status</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaRegistros">
                            <!-- Los registros se cargan dinámicamente aquí vía JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar / Editar Registro -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalTitulo">Registrar Afiliado</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formAfiliado">
                        <input type="hidden" id="registroId">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cédula</label>
                                <input type="text" class="form-control" id="cedula" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">P00</label>
                                <input type="text" class="form-control" id="p00">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fecha_nacimiento">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status Social</label>
                                <select class="form-select" id="status_social">
                                    <option value="Estable">Estable</option>
                                    <option value="Precario">Precario</option>
                                    <option value="En Abandono">En Abandono</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea class="form-control" id="direccion" rows="2"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Teléfono Habitación</label>
                                <input type="text" class="form-control" id="telefono_hab">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Teléfono Celular</label>
                                <input type="text" class="form-control" id="telefono_cel">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Teléfono Alternativo</label>
                                <input type="text" class="form-control" id="telefono_alt">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Correo Alternativo</label>
                                <input type="email" class="form-control" id="correo_alt">
                            </div>
                        </div>

                        <!-- Sección de Ascendientes -->
                        <div class="card mb-3 p-3 bg-light border-0">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label fw-bold mb-0">Familiares Ascendientes</label>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarFamiliar('ascendientesContainer')"><i class="fas fa-plus"></i> Añadir Ascendiente</button>
                            </div>
                            <div id="ascendientesContainer"></div>
                        </div>

                        <!-- Sección de Descendientes -->
                        <div class="card mb-3 p-3 bg-light border-0">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label fw-bold mb-0">Familiares Descendientes</label>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarFamiliar('descendientesContainer')"><i class="fas fa-plus"></i> Añadir Descendiente</button>
                            </div>
                            <div id="descendientesContainer"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contacto Alternativo</label>
                                <input type="text" class="form-control" id="contacto_alt">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Discapacidad</label>
                                <select class="form-select" id="discapacidad" onchange="toggleDiscapacidad()">
                                    <option value="No posee">No posee</option>
                                    <option value="Sí posee">Sí posee</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3" id="divDetalleDiscapacidad" style="display:none;">
                            <label class="form-label">Detalle de la Discapacidad</label>
                            <input type="text" class="form-control" id="detalle_discapacidad">
                        </div>

                        <div class="modal-footer px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success" id="btnGuardar">Guardar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarRegistros();

            // Limpiar formulario al hacer clic en "Nuevo Registro"
            document.getElementById('btnNuevoRegistro').addEventListener('click', () => {
                document.getElementById('formAfiliado').reset();
                document.getElementById('registroId').value = ''; // ¡Borra el ID para que sea un POST limpio!
                document.getElementById('ascendientesContainer').innerHTML = '';
                document.getElementById('descendientesContainer').innerHTML = '';
                document.getElementById('modalTitulo').innerText = 'Registrar Afiliado';
                document.getElementById('divDetalleDiscapacidad').style.display = 'none';
            });

            const form = document.getElementById('formAfiliado');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('registroId').value;
                
                const ascendientes = [];
                document.querySelectorAll('#ascendientesContainer .familiar-row').forEach(row => {
                    ascendientes.push({
                        parentesco: row.querySelector('.fam-parentesco').value,
                        nombre: row.querySelector('.fam-nombre').value,
                        cedula: row.querySelector('.fam-cedula').value
                    });
                });

                const descendientes = [];
                document.querySelectorAll('#descendientesContainer .familiar-row').forEach(row => {
                    descendientes.push({
                        parentesco: row.querySelector('.fam-parentesco').value,
                        nombre: row.querySelector('.fam-nombre').value,
                        cedula: row.querySelector('.fam-cedula').value
                    });
                });

                const data = {
                    nombres: document.getElementById('nombres').value,
                    apellidos: document.getElementById('apellidos').value,
                    cedula: document.getElementById('cedula').value,
                    p00: document.getElementById('p00').value,
                    fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
                    status_social: document.getElementById('status_social').value,
                    direccion: document.getElementById('direccion').value,
                    telefono_hab: document.getElementById('telefono_hab').value,
                    telefono_cel: document.getElementById('telefono_cel').value,
                    telefono_alt: document.getElementById('telefono_alt').value,
                    correo: document.getElementById('correo').value,
                    correo_alt: document.getElementById('correo_alt').value,
                    ascendientes: ascendientes,
                    descendientes: descendientes,
                    contacto_alt: document.getElementById('contacto_alt').value,
                    discapacidad: document.getElementById('discapacidad').value,
                    detalle_discapacidad: document.getElementById('detalle_discapacidad').value
                };

                const url = id ? `/api/registros/${id}` : '/api/registros';
                const method = id ? 'PUT' : 'POST';

                try {
                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (res.ok) {
                        location.reload();
                    } else {
                        alert('Error al guardar el registro.');
                    }
                } catch (err) {
                    console.error(err);
                }
            });
        });

        function agregarFamiliar(containerId, data = {}) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'familiar-row row g-2 align-items-center';
            div.innerHTML = `
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-sm fam-parentesco" placeholder="Parentesco" value="${data.parentesco || ''}">
                </div>
                <div class="col-md-5">
                    <input type="text" class="form-control form-control-sm fam-nombre" placeholder="Nombre completo" value="${data.nombre || ''}">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-sm fam-cedula" placeholder="Cédula" value="${data.cedula || ''}">
                </div>
                <div class="col-md-1 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.parentElement.remove()"><i class="fas fa-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        }

        function toggleDiscapacidad() {
            const val = document.getElementById('discapacidad').value;
            document.getElementById('divDetalleDiscapacidad').style.display = (val === 'Sí posee') ? 'block' : 'none';
        }

        async function cargarRegistros() {
            try {
                const res = await fetch('/api/registros');
                const registros = await res.json();
                const tbody = document.getElementById('tablaRegistros');
                tbody.innerHTML = '';

                registros.forEach(reg => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${reg.id}</td>
                            <td>${reg.cedula}</td>
                            <td>${reg.nombres} ${reg.apellidos}</td>
                            <td>${reg.p00 || ''}</td>
                            <td><span class="badge bg-secondary">${reg.status_social || 'Estable'}</span></td>
                            <td class="text-center">
                                <a href="/api/registros/${reg.id}/pdf" target="_blank" class="btn btn-info btn-sm text-white">PDF</a>
                                <button class="btn btn-warning btn-sm" onclick="editarRegistro(${reg.id})">Modificar</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarRegistro(${reg.id})">Borrar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error cargando registros:', err);
            }
        }

        async function editarRegistro(id) {
            try {
                const res = await fetch(`/api/registros/${id}`);
                const reg = await res.json();
                document.getElementById('registroId').value = reg.id;
                document.getElementById('nombres').value = reg.nombres || '';
                document.getElementById('apellidos').value = reg.apellidos || '';
                document.getElementById('cedula').value = reg.cedula || '';
                document.getElementById('p00').value = reg.p00 || '';
                document.getElementById('fecha_nacimiento').value = reg.fecha_nacimiento || '';
                document.getElementById('status_social').value = reg.status_social || 'Estable';
                document.getElementById('direccion').value = reg.direccion || '';
                document.getElementById('telefono_hab').value = reg.telefono_hab || '';
                document.getElementById('telefono_cel').value = reg.telefono_cel || '';
                document.getElementById('telefono_alt').value = reg.telefono_alt || '';
                document.getElementById('correo').value = reg.correo || '';
                document.getElementById('correo_alt').value = reg.correo_alt || '';
                document.getElementById('contacto_alt').value = reg.contacto_alt || '';
                document.getElementById('discapacidad').value = reg.discapacidad || 'No posee';
                document.getElementById('detalle_discapacidad').value = reg.detalle_discapacidad || '';
                toggleDiscapacidad();

                document.getElementById('ascendientesContainer').innerHTML = '';
                try {
                    const asc = JSON.parse(reg.ascendientes_json || '[]');
                    asc.forEach(f => agregarFamiliar('ascendientesContainer', f));
                } catch(e) {}

                document.getElementById('descendientesContainer').innerHTML = '';
                try {
                    const desc = JSON.parse(reg.descendientes_json || '[]');
                    desc.forEach(f => agregarFamiliar('descendientesContainer', f));
                } catch(e) {}
                
                document.getElementById('modalTitulo').innerText = 'Modificar Afiliado';
                const modal = new bootstrap.Modal(document.getElementById('modalRegistro'));
                modal.show();
            } catch (err) {
                console.error(err);
            }
        }

        async function eliminarRegistro(id) {
            if (confirm('¿Está seguro de eliminar este registro?')) {
                try {
                    await fetch(`/api/registros/${id}`, { method: 'DELETE' });
                    location.reload();
                } catch (err) {
                    console.error(err);
                }
            }
        }
    </script>
</body>
</html>
